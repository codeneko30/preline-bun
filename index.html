<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bun + Preline UI Example</title>
  <!-- Tailwind Output CSS -->
  <link href="./src/output.css" rel="stylesheet">
</head>
<body class="bg-gray-50 flex items-center justify-center h-screen">

  <div class="p-8 bg-white shadow-lg rounded-xl space-y-6">
    <h1 class="text-2xl font-bold text-gray-800">Bun + Preline UI Setup</h1>

    <!-- ১. সাধারণ বাটন এক্সাম্পল -->
    <div>
      <button type="button" class="py-3 px-4 inline-flex items-center gap-x-2 text-sm font-semibold rounded-lg border border-transparent bg-blue-600 text-white hover:bg-blue-700 disabled:opacity-50 disabled:pointer-events-none">
        Primary Button
      </button>
    </div>

    <!-- ২. ড্রপডাউন মেনু এক্সাম্পল -->
    <div class="relative inline-flex">
      <div class="hs-dropdown relative inline-flex">
        <button id="hs-dropdown-example" type="button" class="hs-dropdown-toggle py-3 px-4 inline-flex items-center gap-x-2 text-sm font-medium rounded-lg border border-gray-200 bg-white text-gray-800 shadow-2xs hover:bg-gray-50 focus:outline-hidden focus:bg-gray-50">
          Actions
          <svg class="hs-dropdown-open:rotate-180 size-4 text-gray-600" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </button>

        <div class="hs-dropdown-menu transition-[opacity,margin] duration-150 hs-dropdown-open:opacity-100 opacity-0 hidden min-w-60 bg-white shadow-md rounded-lg p-1 space-y-0.5 mt-2 border border-gray-100 z-10" aria-labelledby="hs-dropdown-example">
          <a class="flex items-center gap-x-3.5 py-2 px-3 rounded-lg text-sm text-gray-800 hover:bg-gray-100 focus:outline-hidden focus:bg-gray-100" href="#">
            Newsletter
          </a>
          <a class="flex items-center gap-x-3.5 py-2 px-3 rounded-lg text-sm text-gray-800 hover:bg-gray-100 focus:outline-hidden focus:bg-gray-100" href="#">
            Purchases
          </a>
          <a class="flex items-center gap-x-3.5 py-2 px-3 rounded-lg text-sm text-gray-800 hover:bg-gray-100 focus:outline-hidden focus:bg-gray-100" href="#">
            Downloads
          </a>
          <a class="flex items-center gap-x-3.5 py-2 px-3 rounded-lg text-sm text-gray-800 hover:bg-gray-100 focus:outline-hidden focus:bg-gray-100" href="#">
            Team Account
          </a>
        </div>
      </div>
    </div>
  </div>

  <!-- Preline UI JavaScript -->
  <script src="./node_modules/preline/dist/preline.js"></script>
</body>
</html>
